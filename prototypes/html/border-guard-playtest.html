<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151d18">
<title>边境守卫 · 试玩</title>
<style>
:root{color-scheme:dark;--bg:#141c17;--paper:#202b23;--raised:#28352a;--line:#3a4a3d;--text:#f1ebd8;--muted:#b6bfad;--accent:#e8b76c;--ink:#251d13;--radius:12px;--red:#ed9a7c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 20% -10%,#28382b 0,transparent 44%),var(--bg);color:var(--text);font:15px/1.5 "Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid #53604b;background:#303d30;border-radius:7px;padding:9px 12px;line-height:1.25;transition:background .15s,border-color .15s;touch-action:manipulation}
button:hover:not(:disabled){background:#414c38;border-color:#ae9669}
button:focus-visible,canvas:focus-visible{outline:2px solid #ffd691;outline-offset:-2px}
button:disabled{cursor:default;opacity:.48}
button.gold{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:800}
button.gold:hover:not(:disabled){background:#f6cb87}
button.quiet{background:transparent;color:#e2e3d1}
[hidden]{display:none!important}
html,body{height:100%}
body{min-height:100vh;overflow:hidden}
h1,h2,p{margin:0}h1{font-family:"Songti SC","SimSun",Georgia,serif;font-size:18px;line-height:1.1;letter-spacing:.06em}h2{font-size:16px;line-height:1.35}
.subtitle{color:var(--muted);font-size:11px;margin-top:2px}
.stage{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:8px 10px;gap:8px}
.edge{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;min-width:0}
.chip{background:rgba(20,28,23,.55);border:1px solid rgba(58,74,61,.75);border-radius:10px;padding:6px 10px;max-width:100%}
.time{display:flex;gap:8px;align-items:center;white-space:nowrap}.time strong{display:block;font-size:15px}.time small{display:block;color:var(--muted);font-size:12px}.phase-icon{color:var(--accent);font-size:20px;width:30px;height:30px;display:grid;place-items:center;border:1px solid #65543a;border-radius:50%;line-height:1}
.stocks{display:flex;gap:10px}.stock{min-width:0}.stock span{display:block;color:var(--muted);font-size:11px;white-space:nowrap}.stock strong{display:block;font:700 18px/1.1 Georgia,serif;color:var(--text);font-variant-numeric:tabular-nums}.stock i{display:inline-block;width:8px;height:8px;margin-right:4px;border-radius:2px;background:var(--t)}
#actionCount{color:var(--accent);font-size:12px}
.map-frame{min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#1a231d;touch-action:manipulation;cursor:crosshair}
.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:3px}.legend .owned{background:#ad9b62}.legend .fog{background:#3a4943}.legend .hostile{background:#ad6858}#legendControl{color:#c8c7a9}
.edge-bottom .chip{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.edge-bottom button{padding:6px 10px}
.command-bar{padding:8px 0;display:flex;gap:7px;flex-wrap:wrap;align-items:center}.command-bar button{padding:8px 10px}.command-bar button.active{border-color:var(--accent);color:#ffd78d;background:#3a3728}.command-bar small{font-size:11px;color:#c7c6a8;display:block;margin-top:2px}
.sheet{position:fixed;z-index:2;top:74px;right:12px;width:min(420px,calc(100vw - 24px));max-height:calc(100vh - 96px);overflow:auto;background:rgba(32,43,35,.94);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:0 12px 40px #070d0bcc}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.panel p{font-size:13px;color:var(--muted);margin-top:6px}.objective{border-top:2px solid #a08352;padding-top:8px}.objective h2{font-size:17px}.section-caption{color:#bac3ae;font-size:11px;letter-spacing:.11em;margin-bottom:6px}.inspect h3{font-size:15px;margin:0}.inspect .tile-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.inspect .tile-actions button{font-size:13px}.panel .info{color:var(--accent)}
.march{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}.march span{text-align:center;color:var(--muted);border:1px solid #465848;border-radius:5px;background:#253329;font-size:11px;padding:4px 0}.march span.current{border-color:#c39c5b;color:#f6cf87;background:#3c3829}.march span.done{color:#e5e8d5;background:#394b36}.march span.boss{color:#f1a78b}
.primary-actions{display:grid;gap:7px;margin-top:10px}.primary-actions:empty{display:none}
.reports ol{list-style:none;margin:7px 0 0;padding:0;font-size:12px;color:var(--muted);max-height:50vh;overflow:auto}.reports li{border-top:1px solid #36453a;padding:5px 0}.reports li:first-child{color:#eee0bb}
#battleHud{margin-top:4px;font-size:12px;color:#f2e6cd}.battle-dot{display:inline-block;width:8px;height:8px;background:#ef9275;margin-right:6px;border-radius:50%}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);max-width:90vw;width:max-content;z-index:4;border:1px solid #97764c;background:#29352b;color:#ffe3ad;border-radius:8px;padding:9px 15px;box-shadow:0 5px 25px #0b120ca6}
dialog{width:min(470px,calc(100vw - 28px));max-height:90vh;overflow:auto;color:var(--text);background:#253228;border:1px solid #9e8151;border-radius:13px;padding:18px;box-shadow:0 18px 70px #070d0bbd}dialog::backdrop{background:#0d1611bf}dialog h2{font-size:21px;margin:0 0 9px}dialog p{margin:9px 0;color:#d0d3bf}dialog .dialog-top{float:right;margin-left:10px}dialog .choices{display:grid;gap:8px;margin-top:14px}dialog .choices button{text-align:left}dialog small{display:block;color:#d9cfac;margin-top:3px}
@media(max-width:720px){h1{font-size:16px}.stocks{gap:6px}.stock strong{font-size:16px}.sheet{top:8px;right:8px;left:8px;width:auto}}

#clockReadout{font-weight:800;color:#f4c982;font-variant-numeric:tabular-nums}
.inspect-heading{display:flex;justify-content:space-between;align-items:center;gap:8px}
.inspect-heading button{font-size:12px;padding:5px 8px}
.tile-actions button small{display:block;margin-top:3px;font-size:11px;color:inherit;opacity:.82}
#campList{background:#202d27}
.inspect .resident-row{margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.resident-row .tile-actions{margin-top:5px}

</style>
</head>
<body>
<div class="stage">
  <div class="edge">
    <div class="chip time" id="chipTime">
      <span id="phaseIcon" class="phase-icon">☼</span>
      <div>
        <h1>边境守卫</h1>
        <div class="subtitle">玩法原型 v0.11 优化试玩 · 试玩数值：白天 35 秒，地图 32×20</div>
        <strong id="phaseName">第 1 日 · 选址</strong>
        <small id="clockReadout"></small>
        <small id="deadline">第 5 夜迎战首领</small>
        <small id="actionCount"></small>
        <div id="battleHud" hidden><span class="battle-dot"></span><span id="battleText"></span></div>
      </div>
    </div>
    <div class="chip stocks" id="stocks"></div>
  </div>
  <div class="map-frame" id="board">
    <canvas id="map" width="1472" height="920" aria-label="边境地图。点击地面或用 WASD 移动，点击已探明资源查看。夜间空格攻击，面板开着也能攻击。" tabindex="0"></canvas>
  </div>
  <div class="edge edge-bottom">
    <div class="chip">
      <button type="button" id="openCommand">指挥</button>
      <button type="button" id="openReports">战报</button>
      <button class="quiet" id="helpBtn">操作指南</button>
      <button class="quiet" id="resetBtn">重新开局</button>
      <span class="legend"><span><i class="owned"></i> 领地</span><span><i class="fog"></i> 未探索</span><span><i class="hostile"></i> 夜袭入口</span><span id="legendControl"></span></span>
      <span id="mapHint">点「指挥」选址或建造。点「战报」看记录。</span>
    </div>
  </div>
</div>
<aside id="commandSheet" class="sheet" hidden>
  <div class="sheet-head"><h2>指挥</h2><button class="quiet" id="closeCommand" type="button">关闭面板</button></div>
  <section class="panel objective">
    <h2 id="goalTitle">第一夜前建立城堡</h2>
    <p id="goalText">两处候选城址的起始圈都能开发粮、木、石和低产金矿。选好后，城堡会留在原地直到本局结束。</p>
    <div id="march" class="march" aria-label="战役进度"></div>
    <div id="primary" class="primary-actions"></div>
  </section>
  <div id="commandBar" class="command-bar"></div>
  <div id="campList" class="command-bar" hidden></div>
  <section class="panel inspect">
    <div class="inspect-heading"><div class="section-caption">地点与管理</div><button class="quiet" id="closeInspector" hidden>关闭面板</button></div>
    <div id="inspectBody"></div>
  </section>
</aside>
<aside id="reportSheet" class="sheet" hidden>
  <div class="sheet-head"><h2>边境战报</h2><button class="quiet" id="closeReports" type="button">关闭面板</button></div>
  <section class="panel reports">
    <ol id="reports" aria-live="polite"></ol>
  </section>
</aside>
<dialog id="dialog">
  <form method="dialog" class="dialog-top"><button class="quiet" aria-label="关闭">关闭</button></form>
  <div id="dialogContent"></div>
</dialog>
<div id="toast" role="status" hidden></div>
<script>
'use strict';

const DEMO = {
  // 试玩数值，不是正式表：白天先收到 35 秒，走路速度仍是 3.5 格/秒。
  daySeconds: 35, nightSeconds: 17, mainCap: 3, campCap: 2,
  spawnInterval: 1.1, carryFactor: 1.5, claimGold: 4, wage: 2, ration: 1,
  campHealth: 80, campDefenses: 3, campCost: {material:8,gold:4},
  repairCost: {material:5}, reclaimGold: 4, rescueRange: 1.6,
  // 试玩：营地当天第一次具备袭击资格时，若剩余白天不足这几秒，或就在入夜那一帧，今夜不打它。
  raidReactSeconds: 10,
  walkSpeed: 3.5,
};
const ROLES = {miner:'矿工', wood:'木工', guard:'守卫'};

function tileOf(unit){
  return tileAt(Math.floor(unit.x),Math.floor(unit.y));
}
function walkable(t){
  return t && t.ground!=='water' && t.building?.type!=='wall';
}
function findPath(from,to,pass=walkable){
  if(!from||!pass(to))return null;
  const start=at(from.x,from.y), end=at(to.x,to.y);
  const previous=new Map([[start,-1]]), queue=[start];
  for(let i=0;i<queue.length&&!previous.has(end);i++){
    const t=game.tiles[queue[i]];
    for(const [dx,dy] of dirs){
      const next=tileAt(t.x+dx,t.y+dy);
      if(!pass(next))continue;
      const key=at(next.x,next.y);
      if(previous.has(key))continue;
      previous.set(key,queue[i]);
      queue.push(key);
    }
  }
  if(!previous.has(end))return null;
  const route=[];
  for(let key=end;key!==start;key=previous.get(key))route.unshift(center(game.tiles[key]));
  return route.length?route:[center(to)];
}
function takeStep(unit,goal,speed,dt){
  const dist=distance(unit,goal);
  if(dist<=speed*dt){
    unit.x=goal.x;unit.y=goal.y;
    return true;
  }
  unit.x+=(goal.x-unit.x)/dist*speed*dt;
  unit.y+=(goal.y-unit.y)/dist*speed*dt;
  return false;
}
function scout(){
  let revealed=false;
  for(const t of game.tiles){
    if(!t.visible&&distance(center(t),game.hero)<1.8){
      t.visible=true;revealed=true;
    }
  }
  return revealed;
}

function makeFront(id,camp,oldCount,newCount,boss=false){
  const queue=[
    ...(boss?['boss']:[]),
    ...Array(oldCount).fill('carried'),
    ...Array(newCount).fill('new'),
  ];
  return {id,camp,queue,cap:camp?DEMO.campCap:DEMO.mainCap,nextSpawn:.45,index:0,stopped:false,route:null};
}
function frontHasRoom(front){
  return game.enemies.filter(e=>e.front===front&&e.hp>0).length<front.cap;
}
function stopFront(front){
  if(!front||front.stopped)return;
  const historical=front.queue.filter(kind=>kind==='carried').length;
  const fresh=front.queue.filter(kind=>kind==='new').length;
  game.carry[front.id]=historical+Math.ceil(fresh*DEMO.carryFactor);
  front.queue=[];
  front.stopped=true;
  if(game.carry[front.id]){
    report((front.camp?campName(front.camp):'主城战场')+'下次遇袭结转 '+game.carry[front.id]+' 名敌军。');
  }
}

function campName(c){return '营地 '+c.number;}
function campTile(c){return game.tiles[c.tile];}
function campAt(t){
  if(!t)return null;
  return game.camps.find(c=>Math.max(Math.abs(campTile(c).x-t.x),Math.abs(campTile(c).y-t.y))<=1)||null;
}
function campCore(t){
  return t&&game.camps.find(c=>c.tile===at(t.x,t.y));
}
function canPlaceCamp(t){
  if(!game.castle||!t?.visible||!walkable(t)||t.site!==undefined||t.node||t.building)return false;
  return game.tiles.filter(cell=>Math.max(Math.abs(cell.x-t.x),Math.abs(cell.y-t.y))<=1)
    .every(cell=>!cell.owned&&!campAt(cell))&&
    findPath(game.castle,t)!==null;
}
function createCamp(t){
  if(game.phase!=='day'||!canPlaceCamp(t)){toast('在已探明、远离现有领地的可通行陆地建立营地。');return null;}
  if(!spend(DEMO.campCost))return null;
  const number=game.camps.length+1;
  const c={id:'camp-'+number,number,tile:at(t.x,t.y),hp:DEMO.campHealth,controlled:false,
    lost:false,running:false,financial:false,auto:false,paid:new Set(),damaged:false,guardTimer:0};
  game.camps.push(c);
  game.mode=null;game.selected=c.tile;openInspector(t);
  announce(campName(c)+'已建成。派一名培养过的居民前往驻守。');
  return c;
}
function canDevelop(t){
  const c=campAt(t);
  return t.owned||Boolean(c?.controlled&&c.running&&!c.lost&&!c.damaged);
}
function canBuildAt(t){
  if(campCore(t)||t.node||t.building||t.ground==='water')return false;
  if(t.owned)return true;
  const c=campAt(t);
  return Boolean(c?.controlled&&!c.lost)&&campDefenseCount(c)<DEMO.campDefenses;
}
function campDefenseCount(c){
  return game.tiles.filter(t=>t.building&&campAt(t)===c).length;
}
function moveCampPriority(c,offset){
  if(game.phase!=='day')return;
  const index=game.camps.indexOf(c), next=index+offset;
  if(!game.camps[next])return;
  [game.camps[index],game.camps[next]]=[game.camps[next],game.camps[index]];
  sync();
}
function campStatus(c){
  if(c.lost)return c.hp>0?'已修复 · 待重占':'彻底失守';
  if(c.damaged)return '受损 · 停产';
  if(c.financial)return '欠维护 · 停产';
  if(c.running)return '运转中';
  return c.controlled?'无人驻守 · 停产':'待派驻';
}
function maintenanceFor(n){
  return {gold:DEMO.wage*n,food:DEMO.ration*n};
}
function campStaff(c,states=['posted','waiting']){
  return game.residents.filter(r=>r.camp===c.id&&states.includes(r.state));
}
function payStaff(c,residents){
  const newIds=residents.map(r=>r.id).filter(id=>!c.paid.has(id));
  const cost=maintenanceFor(newIds.length);
  if(!canPay(cost))return false;
  pay(cost);
  for(const id of newIds)c.paid.add(id);
  return true;
}
function isRaidNight(day=game.day){
  return day>=2&&day%2===0;
}
function noteRaidWindow(c){
  if(game.phase!=='day'||c.lost||!c.controlled)return;
  if(c.raidWindowDay===game.day)return;
  c.raidWindowDay=game.day;
  if(!isRaidNight())return;
  const remaining=DEMO.daySeconds-game.phaseElapsed;
  if(game.nightDue||remaining<DEMO.raidReactSeconds){
    c.raidSkipDay=game.day;
    report(campName(c)+'刚取得控制权，白天只剩 '+Math.max(0,Math.ceil(remaining))+' 秒，不足试玩要求的 '+DEMO.raidReactSeconds+' 秒。今夜不袭击这里，改到之后的夜袭再预告。');
  }
}
function residentOutsideCamp(r,c){
  if(!c)return true;
  const core=campTile(c);
  return Math.max(Math.abs(core.x-Math.floor(r.x)),Math.abs(core.y-Math.floor(r.y)))>1;
}
function releaseEvacuee(r){
  if(r.state!=='leaving')return false;
  const c=game.camps.find(item=>item.id===r.camp);
  if(c&&!residentOutsideCamp(r,c))return false;
  r.camp=null;
  r.state='returning';
  return true;
}
function postResident(r,c){
  if(c.lost||c.damaged){returnResident(r);return;}
  const gained=!c.controlled;
  if(gained)c.controlled=true;
  if(gained)noteRaidWindow(c);
  if(game.phase!=='day'&&!c.paid.has(r.id)){
    r.state='waiting';
    return;
  }
  const paid=c.financial&&!c.paid.has(r.id)?false:payStaff(c,[r]);
  if(!paid){
    r.state='waiting';
    if(!campStaff(c,['posted']).length){c.financial=true;c.running=false;}
    report(campName(c)+'居民已到岗，钱粮不足，等待补缴。');
    return;
  }
  r.state='posted';
  c.running=true;c.financial=false;
  report(campName(c)+'居民到岗，营地可运转。');
}
function retryCamp(c,quiet=false){
  if(game.phase!=='day'||c.lost||c.damaged||!c.controlled)return false;
  const residents=campStaff(c);
  if(!residents.length)return false;
  if(!payStaff(c,residents)){
    if(!quiet)toast(campName(c)+'的金币与粮食须同时足够。');
    return false;
  }
  for(const r of residents)r.state='posted';
  c.running=true;c.financial=false;
  if(!quiet)announce(campName(c)+'恢复运转。');
  return true;
}
function settleCampDawn(){
  for(const c of game.camps){
    c.paid.clear();
    if(c.lost||c.damaged||!c.controlled||!campStaff(c).length){c.running=false;continue;}
    if(c.financial&&!c.auto){c.running=false;continue;}
    if(!retryCamp(c,true)){
      const posted=campStaff(c,['posted']);
      for(const r of posted)r.state='waiting';
      c.financial=true;c.running=false;
      report(campName(c)+'未能支付本周期维护，暂时停产。');
    }
  }
}
function firstResidents(){
  for(let i=0;i<2;i++)addResident();
}
function addResident(){
  const id=game.nextResident++;
  game.residents.push({id,role:null,state:'home',camp:null,hp:28,...center(game.castle),route:[],cooldown:0});
}
function recruitResident(){
  if(game.phase!=='day'||!game.castle||!spend({gold:5,food:1},false))return;
  addResident();
  announce('一名新居民加入城堡。');
}
function trainResident(r,role){
  if(game.phase!=='day'||r.state!=='home'||r.role||!ROLES[role]||!spend({gold:2},false))return;
  r.role=role;
  announce('居民 '+r.id+' 培养为'+ROLES[role]+'。');
}
function dispatchResident(r,c){
  if(game.phase!=='day'||r.state!=='home'||!r.role||c.lost||c.damaged)return false;
  const route=findPath(tileOf(r),campTile(c));
  if(!route){toast('营地和城堡之间没有可通行道路。');return false;}
  r.route=route;r.state='outbound';r.camp=c.id;
  announce(ROLES[r.role]+' '+r.id+' 正在前往'+campName(c)+'。');
  return true;
}
function returnResident(r,escort=false){
  if(!game.castle)return false;
  const route=escort?[]:findPath(tileOf(r),game.castle);
  if(!route)return false;
  r.route=route;
  if(escort){
    r.state='escorted';
    r.camp=null;
    return true;
  }
  r.state='leaving';
  if(releaseEvacuee(r))report('居民 '+r.id+' 已在营地范围外，开始返回城堡。');
  return true;
}
function recallResident(r,c){
  if(game.phase!=='day'||r.camp!==c.id||!['posted','waiting','outbound'].includes(r.state))return;
  if(!returnResident(r)){toast('暂时找不到可返回城堡的道路。');return;}
  if(!campStaff(c,['posted']).length)c.running=false;
  announce(r.state==='leaving'
    ?'居民 '+r.id+' 开始返回。人还在营地里，营地失守仍会受伤。'
    :'居民 '+r.id+' 已离开营地，正在返回城堡。');
}
function evacuateCamp(c){
  if(game.phase!=='day'||c.lost)return;
  const residents=campStaff(c,['posted','waiting','outbound']);
  if(!residents.length)return;
  const ready=residents.filter(r=>game.castle&&findPath(tileOf(r),game.castle));
  if(!ready.length){
    const message=campName(c)+'撤离失败：没有通往城堡的路。居民仍在原地，营地状态没有改变。';
    report(message);
    toast(message);
    sync();
    return;
  }
  for(const r of ready)returnResident(r);
  c.running=false;
  const stuck=residents.length-ready.length;
  announce(campName(c)+'已停产。'+ready.length+' 名居民开始撤离，离开营地范围前仍会计入失守。'+(stuck?stuck+' 名居民无路可走，仍留在原地。':''));
}
function rescueCamp(c){
  if(game.phase!=='night'||c.lost||game.hero.hp<=0||distance(game.hero,center(campTile(c)))>DEMO.rescueRange)return;
  const residents=campStaff(c,['posted','waiting']);
  if(!residents.length)return;
  for(const r of residents)returnResident(r,true);
  c.running=false;
  announce('已接到'+campName(c)+'的 '+residents.length+' 名居民，请带他们回城。');
}
function repairCamp(c){

  c.hp=DEMO.campHealth;c.damaged=false;
  if(c.controlled&&!c.lost)retryCamp(c,true);

  return true;
}
function reclaimCamp(c){
  if(game.phase!=='day'||!c.lost||c.hp<DEMO.campHealth||!spend({gold:DEMO.reclaimGold},false))return false;
  c.lost=false;c.controlled=true;
  c.raidWindowDay=null;
  c.raidSkipDay=null;
  noteRaidWindow(c);
  announce(campName(c)+'已重新占领。请重新派驻居民。');
  return true;
}
function loseCamp(c,front){
  if(c.lost)return;
  c.hp=0;c.lost=true;c.controlled=false;c.running=false;c.financial=false;
  c.raidWindowDay=null;
  stopFront(front);
  if(front&&game.castle){
    calculateRoutes(front,game.castle);
    for(const enemy of game.enemies){
      if(enemy.front===front)enemy.next=null;
    }
  }
  for(const r of campStaff(c,['posted','waiting','leaving'])){
    hurtResident(r,true);
  }
  for(const r of campStaff(c,['outbound']))returnResident(r);
  report(campName(c)+'彻底失守。保留开发成果和结转，场上残敌转向主城。');
  sync();
}
function hurtResident(r,defeated=false){
  r.hp=defeated?0:Math.max(0,r.hp-7);
  if(r.hp>0)return;
  r.camp=null;r.route=[];
  if(game.hard){
    r.state='dead';
    report('居民 '+r.id+' 在战斗中阵亡。');
  }else{
    r.state='hurt';r.recoverDay=game.day+2;
    Object.assign(r,center(game.castle));
    report('居民 '+r.id+' 受伤，已撤回城堡休养。');
  }
  sync();
}
function updateResidents(dt){
  let changed=false;
  for(const r of game.residents){
    if(r.state==='hurt'&&game.day>=r.recoverDay){
      r.state='home';r.hp=28;changed=true;
      continue;
    }
    if(r.state==='escorted'){
      if(distance(r,center(game.castle))<.65){
        r.state='home';r.route=[];changed=true;
        report('居民 '+r.id+' 已安全回城。');
      }else if(game.hero.hp>0&&distance(r,game.hero)>.5){
        r.routeTarget=tileOf(game.hero);
        const next=findPath(tileOf(r),r.routeTarget)?.[0];
        if(next)takeStep(r,next,2.75,dt);
      }
      continue;
    }
    if(r.state==='leaving'){
      const next=r.route[0];
      if(next)r.face=next.x<r.x?-1:1;
      if(next&&takeStep(r,next,2.45,dt))r.route.shift();
      r.moving=Boolean(next);
      if(releaseEvacuee(r)){
        report('居民 '+r.id+' 已离开营地范围，不再受该营地失守影响。');
        changed=true;
      }
      if(r.state==='returning'&&!r.route.length){
        r.state='home';r.moving=false;
        report('居民 '+r.id+' 已安全回城。');
        changed=true;
      }
      continue;
    }
    if(!['outbound','returning'].includes(r.state))continue;
    if(r.route[0])r.face=r.route[0].x<r.x?-1:1;
    if(r.route[0]&&takeStep(r,r.route[0],2.45,dt))r.route.shift();
    r.moving=Boolean(r.route.length);
    if(r.route.length)continue;
    if(r.state==='returning'){
      r.state='home';
      report('居民 '+r.id+' 已安全回城。');
    }else{
      const c=game.camps.find(item=>item.id===r.camp);
      if(c)postResident(r,c);
    }
    changed=true;
  }
  if(changed)sync();
}
function campYield(t){
  const c=campAt(t);
  if(!c?.controlled||!c.running||c.lost||c.damaged)return 0;
  const match=['rich','iron','stone','mine'].includes(t.node.kind)?'miner':t.node.kind==='wood'?'wood':null;
  return YIELD[t.node.kind][1]+campStaff(c,['posted']).filter(r=>r.role===match).length*2;
}
function raidCamp(){
  if(!isRaidNight())return null;
  const eligible=game.camps.filter(c=>c.controlled&&!c.lost&&c.raidSkipDay!==game.day).sort((a,b)=>a.number-b.number);
  return eligible.length?eligible[(game.day/2-1)%eligible.length]:null;
}
function campGate(c){
  const target=campTile(c);
  const edge=game.tiles.filter(t=>walkable(t)&&(t.y===0||t.y===HEIGHT-1||t.x===0||t.x===WIDTH-1));
  return edge.sort((a,b)=>distance(a,target)-distance(b,target)).find(t=>findPath(t,target))||target;
}

function at(x,y){return y * WIDTH + x;}

function randomSeed(seed) {
  let value = seed >>> 0;
  return () => {
    value = (Math.imul(value,1664525)+1013904223) >>> 0;
    return value / 4294967296;
  };
}
function paintNode(t,kind){
  t.node={kind};
  t.field=false;
  if(kind==='wood')t.ground='trees';
  else if(kind==='farm'){t.ground='grass';t.field=true;}
  else if(['stone','mine','rich','iron'].includes(kind))t.ground='rock';
  else if(t.ground!=='road')t.ground='grass';

function makeGame(seed = Math.floor(Math.random()*999999)+1) {
  const rnd = randomSeed(seed);
  const sites = [{x:5,y:4},{x:11,y:5}];
  const tiles = [];
  for(let y=0;y<HEIGHT;y++){
    for(let x=0;x<WIDTH;x++){
      const road = (x<8&&y===4)||(x>=8&&x<=16&&y===5)||(x===8&&y===4)||
        (x>=16&&x<=22&&y===5)||(x===22&&y>=5&&y<=12)||(x>=21&&x<=22&&y===10);
      const water = (y===0&&x>10)||(y===9&&x<7)||(x===16&&y<3)||
        (y===1&&x>=12&&x<=14)||(y===8&&x===0)||
        (y===10&&x<=20);
      const roll = rnd();
      const oldMap = x<17&&y<10;
      let ground = 'grass';
      let field = false;
      if(water)ground='water';
      else if(road)ground='road';
      else if(oldMap){
        ground = roll<.17?'trees':roll<.24?'rock':'grass';
        if(ground==='grass'&&roll>.975)field=true;
      }else{
        ground = roll<.12?'trees':roll<.18?'rock':'grass';
        if(ground==='grass'&&roll>.97)field=true;

    }
  }
  const groups = [
    [[4,3],[3,5],[5,6],[6,3]],
    [[12,6],[13,4],[11,3],[10,6]]
  ];

  for(const group of groups){
    const rotation = Math.floor(rnd()*4);
    group.forEach(([x,y],index)=>paintNode(tiles[at(x,y)],types[(index+rotation)%4]));
  }
  const special = [
    ['rich',rnd()<.5?7:9,2],['iron',rnd()<.5?7:9,8],
    ['relic',8,3],['danger',rnd()<.5?3:13,1],['shard',8,7],['artifact',8,1]
  ];
  special.forEach(([kind,x,y])=>{
    const t=tiles[at(x,y)];
    paintNode(t,kind);
    t.visible=false;
  });
  const farther = [
    ['wood',20,3],['stone',25,6],['mine',29,4],['farm',28,8],['wood',18,2],
    ['farm',5,13],['wood',8,16],['stone',14,16],['mine',19,14],['wood',27,15],['farm',30,18],

  ];
  farther.forEach(([kind,x,y])=>paintNode(tiles[at(x,y)],kind));
  const pockets = [[24,5],[11,13],[16,15],[26,16]];
  for(const [px,py] of pockets){

  sites.forEach((site,index)=>{
    const t=tiles[at(site.x,site.y)];

function report(message) {

function toast(message) {

function costText(cost) {
  return Object.entries(cost).map(([name,amount])=>amount+' '+RESOURCE_LABELS[name]).join(' · ');
}
function canPay(cost){return Object.entries(cost).every(([name,amount])=>game.resources[name]>=amount);}
function pay(cost){
  for(const [name,amount] of Object.entries(cost)) game.resources[name]-=amount;
}
function spend(cost,action=true){
  if(action && (game.phase!=='day'||game.actions<=0)){toast('今天的白天行动已用完。');return false;}
  if(!canPay(cost)){toast('需要 '+costText(cost)+'。');return false;}

}

function chooseSite(index) {

function claim(t){
  if(game.phase!=='day'||!game.castle||t.owned||!t.visible||t.ground==='water'||campAt(t)||!isAdjacent(t))return;

  if(!t.visible||!canDevelop(t)||!t.node||!YIELD[t.node.kind]||t.node.developed)return;
  if(!spend({material:2}))return;

function build(t,type) {

function repair(t) {

  if(t===game.castle){
    if(game.castleHp>=game.castleMax)return;
    if(!spend(game.phase==='night'?{gold:5}:{material:5},game.phase!=='night'))return;
    game.castleHp=Math.min(game.castleMax,game.castleHp+(game.phase==='night'?18:35));

    else announce('城堡白天维修完成。');
  } else if(t.node?.damaged){
    if(!spend({material:4}))return;
    t.node.damaged=false;
    announce(NODE_NAMES[t.node.kind]+'恢复生产。');
  } else if(b && b.hp<b.max){
    if(!spend({material:3}))return;

  const b=t.building;
  if(b?.type!=='tower'||b.level>=2)return;

  const cost=b.level===0?{material:7,gold:4}:{material:8,gold:5};
  if(!spend(cost))return;
  b.level++;

  b.hp=Math.min(b.max,b.hp+15);

function salvage(t){

  game.heroLevel++;
  game.hero.max+=8;

  if(!game.hero||game.hero.hp>=game.hero.max)return;

  game.hero.hp=Math.min(game.hero.max,game.hero.hp+(game.phase==='night'?26:38));

function enlist(){
  if(game.militia>=2)return;
  if(!spend({food:3}))return;

function edgeGate(x,preferY){
  let best=null,bestDist=Infinity;
  for(let y=0;y<HEIGHT;y++){
    const t=tileAt(x,y);
    if(!t||!walkable(t))continue;
    const dist=Math.abs(y-preferY);
    if(dist<bestDist){best=t;bestDist=dist;}
  }
  return best||tileAt(x,Math.max(0,Math.min(HEIGHT-1,preferY)));
}
function entrances(day){
  const prefer=game.castle?game.castle.y:Math.round(game.hero.y);
  const west=edgeGate(0,prefer), east=edgeGate(WIDTH-1,prefer);
  const westSide=(game.castle?.x??game.hero.x)<WIDTH/2;
  if(day===1)return [westSide?west:east];
  if(day===2)return [westSide?east:west];
  return day%2===0?[east,west]:[west,east];
}
function calculateRoutes(front,target=front.camp&&!front.camp.lost?campTile(front.camp):game.castle||tileOf(game.hero)) {
  const scores=Array(game.tiles.length).fill(Infinity);
  const seen=new Set();
  scores[at(target.x,target.y)]=0;
  for(let j=0;j<game.tiles.length;j++){
    let chosen=-1;
    for(let i=0;i<scores.length;i++){
      if(!seen.has(i)&&scores[i]<(chosen<0?Infinity:scores[chosen]))chosen=i;
    }
    if(chosen<0)break;
    seen.add(chosen);
    const t=game.tiles[chosen];
    const effort=t.building?.type==='wall'?5.1:t.ground==='road'?.75:t.ground==='trees'?1.5:1.22;
    for(const [dx,dy] of dirs){
      const n=tileAt(t.x+dx,t.y+dy);
      if(!n||n.ground==='water')continue;
      const index=at(n.x,n.y);
      scores[index]=Math.min(scores[index],scores[chosen]+effort);
    }
  }
  front.route=scores;
  front.targetIndex=at(target.x,target.y);
}
function startNight(){
  if(game.phase!=='day')return;
  const raid=raidCamp();
  game.phase='night';game.mode=null;game.clock=0;game.spawnStopped=false;
  game.isBoss=Boolean(game.castle&&(game.day>=LAST_NIGHT||game.scheduled));
  const main=makeFront('home',null,game.carry.home,game.isBoss?6:4+game.day*2,game.isBoss);
  main.gates=entrances(game.day);game.fronts=[main];
  if(raid){
    const front=makeFront(raid.id,raid,game.carry[raid.id]||0,3+Math.floor(game.day/2));
    front.gates=[campGate(raid)];game.fronts.push(front);
  }
  game.waveKills=0;game.waveGold=0;game.effects=[];game.militiaCooldown=0;
  for(const front of game.fronts){game.carry[front.id]=0;calculateRoutes(front);}
  const target=game.castle?'敌军开始进攻城堡。':'尚未建城，敌军正在追击领主。';
  const panelNote=blocksMove()?' 面板仍开着：不能点地图移动，空格或「领主攻击」仍然有效。':'';
  announce((game.isBoss?'首领现身。':'第 '+game.day+' 夜。')+target+(raid?campName(raid)+'也在遇袭。':'')+panelNote);
}
function spawnEnemy(front){
  const gate=front.gates[front.index%front.gates.length];
  const kind=front.queue.shift();
  const isBoss=kind==='boss';
  const heavy=!isBoss && game.day>1 && ((front.index+game.seed)%5===0);
  const hp=isBoss?Math.round(430*(game.fragments?.82:1)):heavy?45+game.day*7:20+game.day*4;
  game.enemies.push({
    ...center(gate),front,hp,max:hp,boss:isBoss,heavy,
    speed:isBoss?.72:heavy?.86:1.38+(front.index%3)*.09,cooldown:0,flash:0,next:null
  });
  front.index++;
}
function damageEnemy(enemy,amount){
  if(enemy.hp<=0)return;
  enemy.hp-=amount;enemy.flash=.12;
  if(enemy.hp<=0){
    game.waveKills++;game.kills++;game.xp++;
    game.resources.gold+=enemy.boss?8:1;
    game.waveGold+=enemy.boss?8:1;
    game.effects.push({type:'spark',x:enemy.x,y:enemy.y,time:.32,max:.32,color:'#ffda84'});
  }

function attack(){

  for(const enemy of nearby){

function heroCanStep(x,y){
  return walkable(tileAt(Math.floor(x),Math.floor(y)));
}
function setDestination(t){

function moveHero(dt){
  const h=game.hero;
  h.cooldown=Math.max(0,h.cooldown-dt);
  h.hit=Math.max(0,h.hit-dt);
  if(h.hp<=0||$('dialog').open)return;
  if(game.phase==='night'&&keys.has(' '))attack();
  if(blocksMove()){h.moving=false;return;}
  const dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft'));
  const dy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));
  const length=Math.hypot(dx,dy);
  if(length){
    h.goal=null;
    if(dx)h.face=dx<0?-1:1;
    const nx=h.x+dx/length*DEMO.walkSpeed*dt, ny=h.y+dy/length*DEMO.walkSpeed*dt;
    if(heroCanStep(nx,h.y))h.x=nx;
    if(heroCanStep(h.x,ny))h.y=ny;
    h.moving=true;
  }else if(h.goal?.length){
    const next=h.goal[0];
    if(!heroCanStep(next.x,next.y)){h.goal=null;h.moving=false;}
    else{
      h.face=next.x<h.x?-1:1;
      h.moving=true;
      if(takeStep(h,next,DEMO.walkSpeed,dt))h.goal.shift();
    }
  }else h.moving=false;
}
function moveEnemy(e,dt){
  e.cooldown-=dt;e.flash-=dt;
  const h=game.hero, front=e.front, camp=front.camp?.lost?null:front.camp;
  const targetTile=camp?campTile(camp):game.castle||tileOf(h);
  const targetPoint=camp||game.castle?center(targetTile):h;
  if(!camp&&!game.castle&&front.targetIndex!==at(targetTile.x,targetTile.y))calculateRoutes(front,targetTile);
  if(e.cooldown<=0){
    if(h.hp>0&&distance(e,h)<.8){
      const impact=e.boss?16:e.heavy?8:4;
      h.hp=Math.max(0,h.hp-(game.artifact==='charm'?Math.ceil(impact*.75):impact));
      e.cooldown=.95;
      if(h.hp===0&&game.castle)report('领主受伤，城防继续坚守。');
    }else{
      const resident=game.residents.find(r=>['outbound','returning','escorted','leaving'].includes(r.state)&&distance(e,r)<.8);
      if(resident){hurtResident(resident);e.cooldown=1;}
    }
  }
  if(distance(e,targetPoint)<.72){
    if(e.cooldown<=0&&(camp||game.castle)){
      const impact=e.boss?19:e.heavy?9:5;
      if(camp){
        camp.hp=Math.max(0,camp.hp-impact);
        if(!camp.hp)loseCamp(camp,front);
      }else game.castleHp=Math.max(0,game.castleHp-impact);
      e.cooldown=1;
    }
    return;
  }
  if(!camp&&!game.castle&&tileOf(e)===targetTile){e.face=h.x<e.x?-1:1;e.moving=true;takeStep(e,h,e.speed,dt);return;}
  if(!e.next||distance(e,center(e.next))<.055){
    const current=tileOf(e);
    const score=t=>front.route[at(t.x,t.y)]+(t.building?.type==='wall'?4.35:0);
    e.next=dirs.map(([dx,dy])=>tileAt(current.x+dx,current.y+dy))
      .filter(t=>t&&t.ground!=='water'&&Number.isFinite(score(t))).sort((a,b)=>score(a)-score(b))[0];
    if(!e.next)return;
  }
  const goal=center(e.next), wall=e.next.building;
  if(wall?.type==='wall'&&distance(e,goal)<.68){
    if(e.cooldown<=0){
      wall.hp-=e.boss?35:e.heavy?22:12;
      e.cooldown=.85;
      if(wall.hp<=0){
        e.next.building=null;
        for(const route of game.fronts)calculateRoutes(route);
        report('一段城墙被摧毁。');
      }
    }
    return;
  }
  e.face=goal.x<e.x?-1:1;e.moving=true;
  takeStep(e,goal,e.speed,dt);
}
function towerRange(building){return 2.35+building.level*.25+game.ranks.tower*.16;}
function fireTowers(dt){
  const castle=game.castle?center(game.castle):game.hero;
  const enemies=game.enemies.filter(e=>e.hp>0);
  for(const t of game.tiles){
    const b=t.building;
    if(b?.type!=='tower'||(!t.owned&&!campAt(t)?.controlled))continue;
    b.cooldown-=dt;
    if(b.cooldown>0)continue;
    const origin=center(t);
    const target=enemies.filter(e=>e.hp>0&&distance(origin,e)<towerRange(b))
      .sort((a,c)=>distance(a,castle)-distance(c,castle))[0];
    if(!target)continue;
    damageEnemy(target,11+b.level*5+game.ranks.tower*8+game.bonuses.bow*4);
    b.cooldown=.72;
    game.effects.push({type:'arrow',x:origin.x,y:origin.y,tx:target.x,ty:target.y,time:.18,max:.18});
  }
  game.militiaCooldown-=dt;
  if(game.castle&&game.militia&&game.militiaCooldown<=0){
    const target=enemies.find(e=>e.hp>0&&distance(e,castle)<1.7);
    if(target){
      damageEnemy(target,game.militia*(6+3*game.bonuses.militia+(game.artifact==='lantern'?3:0)));
      game.militiaCooldown=.78;
    }
  }
  for(const camp of game.camps){
    if(!camp.controlled||camp.lost)continue;
    camp.guardTimer-=dt;
    const guards=campStaff(camp,['posted']).filter(r=>r.role==='guard').length;
    const target=enemies.find(e=>e.hp>0&&distance(e,center(campTile(camp)))<1.8);
    if(guards&&target&&camp.guardTimer<=0){
      damageEnemy(target,guards*9);
      camp.guardTimer=.8;
    }
  }
}
function dawn(){
  const finished=game.day;
  game.phase='day';game.day++;game.phaseElapsed=0;game.actions=7;game.enemies=[];game.effects=[];game.mode=null;
  game.hero.hp=Math.max(Math.min(game.hero.max,game.hero.hp+13),35);
  report('第 '+finished+' 夜结束：击退 '+game.waveKills+' 只怪物，获得 '+game.waveGold+' 击杀金币。');
  const income={gold:0,material:0,food:0};
  for(const t of game.tiles){
    if(!t.node?.developed||!YIELD[t.node.kind])continue;
    const [type,amount]=YIELD[t.node.kind];
    income[type]+=t.owned?amount:campYield(t);
  }
  for(const [type,amount] of Object.entries(income))game.resources[type]+=amount;
  const total=Object.fromEntries(Object.entries(income).filter(([,amount])=>amount>0));
  if(Object.keys(total).length)report('天亮产出 '+costText(total)+'。');
  settleCampDawn();
  if(game.castle&&game.xp>=game.nextCard){
    game.cardPending=true;game.nextCard+=16;
    const available=[...CARDS];
    game.cardChoices=Array.from({length:3},()=>available.splice(Math.floor(game.rnd()*available.length),1)[0]);
    report('主城成长，可以选择一项强化。');
  }
  game.announcedRaid=null;
  sync();
}
function finish(victory){
  game.phase=victory?'won':'lost';
  game.result={day:game.day,early:victory&&game.early};
  game.enemies=[];game.effects=[];game.panel=false;
  report(victory?(game.early?'首领败退，获得提前通关记录。':'首领败退，边境守卫战结束。'):game.castle?'城堡失守，本局结束。':'领主倒下，本局结束。');
  sync();
}
function advanceBattle(dt){
  game.clock+=dt;
  if(!game.spawnStopped&&game.clock>=DEMO.nightSeconds){
    game.spawnStopped=true;
    for(const front of game.fronts)stopFront(front);
    report('本夜停止刷新，清完场上残敌后天亮。');
    sync();
  }
  if(!game.spawnStopped){
    for(const front of game.fronts){
      if(front.queue.length&&game.clock>=front.nextSpawn&&frontHasRoom(front)){
        spawnEnemy(front);
        front.nextSpawn=game.clock+DEMO.spawnInterval;
      }
    }
  }
  fireTowers(dt);
  for(const e of game.enemies)if(e.hp>0)moveEnemy(e,dt);
  game.enemies=game.enemies.filter(e=>e.hp>0);
  for(const effect of game.effects)effect.time-=dt;
  game.effects=game.effects.filter(e=>e.time>0);
  if(game.castleHp<=0||(!game.castle&&game.hero.hp<=0)){finish(false);return;}
  if(game.enemies.length||game.fronts.some(front=>front.queue.length))return;
  for(const front of game.fronts){
    const camp=front.camp;
    if(camp&&!camp.lost&&camp.hp<DEMO.campHealth*.55){
      camp.damaged=true;camp.running=false;
      report(campName(camp)+'严重受损，维修前暂停生产。');
    }
  }
  if(game.isBoss)finish(true);
  else dawn();
}
function tickCampaign(dt){
  if(!['day','night'].includes(game.phase))return;
  moveHero(dt);
  game.nightDue=game.phase==='day'&&game.phaseElapsed+dt>=DEMO.daySeconds;
  updateResidents(dt);
  if(game.phase==='day'){
    if(scoutAroundHero())sync();
    game.phaseElapsed+=dt;
    const raid=raidCamp();
    if(raid&&game.announcedRaid!==raid.id){
      if(game.phaseElapsed>=DEMO.daySeconds){
        raid.raidSkipDay=game.day;
        report(campName(raid)+'直到入夜这一刻才成为目标，今夜不打，留到之后的夜袭再预告。');
      }else{
        game.announcedRaid=raid.id;
        report('侦察预告：'+campName(raid)+'今夜将遭袭。还可以撤离、布防，或亲自赶过去。');
      }
      sync();
    }
    if(game.phaseElapsed>=DEMO.daySeconds)startNight();
  }else advanceBattle(dt);
  game.nightDue=false;
}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h);}
function path(points,color,stroke=null,weight=1){

}

function line(x1,y1,x2,y2,color,width=1) {

function wheatPatch(x,y){

function terrain(t){
  inCell(t.x*CELL,t.y*CELL,()=>{
    const x=0,y=0,v=t.variation;
    if(t.ground==='water'){
      rect(x,y,60,60,v>.5?'#3d615c':'#3b5b58');
      line(x+6,y+13,x+26,y+12,'#65827a');line(x+36,y+42,x+51,y+40,'#68897b');
      line(x+11,y+48,x+26,y+47,'#4e766e');
      return;
    }
    const colors=t.owned?['#70805a','#78865c','#71815c','#79865c']:['#5d7457','#647859','#5c7354','#687b58'];
    rect(x,y,60,60,colors[Math.floor(v*colors.length)]);
    const speck='#7f95664c';
    for(let i=0;i<5;i++){
      const dx=(7+i*17+v*29)%57,dy=(11+i*11+v*47)%58;
      rect(x+dx,y+dy,1+i%3,1,speck);
    }
    if(t.ground==='road'){
      const east=tileAt(t.x+1,t.y)?.ground==='road', west=tileAt(t.x-1,t.y)?.ground==='road';

function boundaries(showStarting){
  const lineColor=showStarting?'#efd49aa6':'#f1d68eb8';
  for(const t of game.tiles){
    const region=showStarting?game.sites.findIndex(s=>Math.abs(t.x-s.x)<=2&&Math.abs(t.y-s.y)<=2):t.owned?0:-1;
    if(region===-1)continue;
    const x=t.x*CELL,y=t.y*CELL;
    dirs.forEach(([dx,dy])=>{
      const n=tileAt(t.x+dx,t.y+dy);
      const adjacent=n&&(showStarting?Math.abs(n.x-game.sites[region].x)<=2&&Math.abs(n.y-game.sites[region].y)<=2:n.owned);
      if(adjacent)return;
      const sx=dx>0?x+CELL:x,sy=dy>0?y+CELL:y;
      line(sx,sy,dx?sx:x+CELL,dy?sy:y+CELL,lineColor,2);
    });
  }
}
function draw(){
  if(!game)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const isNight=game.phase==='night';
  for(const t of game.tiles){
    const x=t.x*CELL,y=t.y*CELL;
    terrain(t);
    if(t.visible&&t.node)nodeArt(t);
    if(t.building)structure(t);
    rect(x,y,CELL,1,'#1b322824');rect(x,y,1,CELL,'#1b322824');
    if(!t.visible){
      inCell(x,y,()=>{
        rect(0,0,60,60,'#283b34a6');
        line(9,51,52,9,'#7984771f');
      });
    }
  }
  const shade=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  shade.addColorStop(0,isNight?'#141e3d59':'#efd99414');
  shade.addColorStop(1,isNight?'#1323346b':'#203a2f26');
  rect(0,0,canvas.width,canvas.height,shade);
  boundaries(!game.castle);
  if(!game.castle){
    game.sites.forEach((s,i)=>{
      inCell(s.x*CELL,s.y*CELL,()=>{
        oval(30,30,23,23,'#2b3526');oval(30,30,19,19,'#ecc37d');label(i?'B':'A',30,31,23,'#28251d');
        label(SITE_NAMES[i],30,68,17,'#fff0c6');
      });
    });
  }
  if(['day','night'].includes(game.phase)){
    const gates=game.phase==='night'?game.fronts.flatMap(front=>front.gates):entrances(game.day);
    for(const t of gates){
      inCell(t.x*CELL,t.y*CELL,()=>{
        oval(30,31,15,15,'#582e2d');path([[23,24],[37,31],[23,38]],'#ef9e81');
      });
    }
  }
  const sel=game.tiles[game.selected];
  if(sel&&game.panel){
    ctx.strokeStyle='#ffe1a0';ctx.lineWidth=3;ctx.strokeRect(sel.x*CELL+2*CELL/60,sel.y*CELL+2*CELL/60,(60-4)*CELL/60,(60-4)*CELL/60);
    if(sel.building?.type==='tower'){
      ctx.beginPath();ctx.arc((sel.x+.5)*CELL,(sel.y+.5)*CELL,towerRange(sel.building)*CELL,0,Math.PI*2);
      ctx.fillStyle='#edd39415';ctx.fill();ctx.strokeStyle='#ffe1a093';ctx.setLineDash([6,6]);ctx.stroke();ctx.setLineDash([]);
    }
  }
  for(const c of game.camps)drawCamp(c);
  for(const r of game.residents){
    if(!['outbound','returning','escorted','leaving'].includes(r.state))continue;
    inCell(r.x*CELL,r.y*CELL,()=>{
      oval(0,0,6,8,r.state==='outbound'?'#f7d78a':'#a7eddd');
    });
  }
  if(game.hero.hp>0&&['day','night'].includes(game.phase))fighter(game.hero,true);
  if(isNight){
    for(const e of game.enemies)fighter(e);
    for(const e of game.effects){
      const fade=e.time/e.max;
      if(e.type==='arrow')line(e.x*CELL,e.y*CELL-12*CELL/60,e.tx*CELL,e.ty*CELL-6*CELL/60,'rgba(255,217,132,'+fade+')',2);
      else oval(e.x*CELL,e.y*CELL,11*fade*CELL/60,11*fade*CELL/60,e.color);
    }
  }
}

function button(label,click,{detail='',gold=false,active=false,disabled=false}={}){
  const el=document.createElement('button');
  el.type='button';el.textContent=label;el.disabled=disabled;
  if(gold)el.classList.add('gold');
  if(active){el.classList.add('active');el.setAttribute('aria-pressed','true');}
  if(detail){const sm=document.createElement('small');sm.textContent=detail;el.append(sm);}
  el.addEventListener('click',click);
  return el;
}

function renderMarch(){
  const march=$('march');

  for(let i=1;i<=LAST_NIGHT;i++){
    const step=document.createElement('span');
    step.textContent=(i===LAST_NIGHT||i===game.day&&game.scheduled)?'首领':i+' 夜';
    if(i===LAST_NIGHT||i===game.day&&game.scheduled)step.classList.add('boss');
    if(i<game.day||(game.phase==='won'&&i===game.day))step.classList.add('done');

function residentRow(parent,r,actions){

function inspectCamp(c,heading,info,actions,parent){
  const day=game.phase==='day', staff=campStaff(c);
  heading.textContent=campName(c);
  info.textContent=campStatus(c)+' · 耐久 '+Math.ceil(c.hp)+'/'+DEMO.campHealth+
    ' · 驻员 '+staff.length+' · 每人 '+costText(maintenanceFor(1))+' · 合计 '+costText(maintenanceFor(staff.length));
  if(c.controlled)info.textContent+=' · 基础防御 '+campDefenseCount(c)+'/'+DEMO.campDefenses;
  const carry=game.carry[c.id]||0;
  if(carry)info.textContent+=' · 保留结转 '+carry+' 名';
  if(day){
    if(c.hp<DEMO.campHealth||c.damaged)actions.append(button('修复核心',()=>repairCamp(c),{detail:costText(DEMO.repairCost),disabled:!game.actions}));
    if(c.lost){
      actions.append(button('重新占领',()=>reclaimCamp(c),{detail:DEMO.reclaimGold+' 金币',disabled:c.hp<DEMO.campHealth}));
      return;
    }
    if(game.camps.length>1){
      const priority=game.camps.indexOf(c);
      info.textContent+=' · 维护顺序 '+(priority+1)+'/'+game.camps.length;
      actions.append(
        button('提前结算',()=>moveCampPriority(c,-1),{disabled:priority===0}),
        button('推后结算',()=>moveCampPriority(c,1),{disabled:priority===game.camps.length-1})
      );
    }
    actions.append(button(c.auto?'关闭自动复产':'开启自动复产',()=>{c.auto=!c.auto;sync();}));
    if(staff.some(r=>r.state==='waiting'))actions.append(button('补缴维护并复产',()=>retryCamp(c)));
    const roster=campStaff(c,['posted','waiting','outbound']);
    if(roster.length)actions.append(button('撤离营地',()=>evacuateCamp(c)));
    for(const r of roster)residentRow(parent,r,[button('调回居民',()=>recallResident(r,c))]);
    for(const r of game.residents.filter(r=>r.state==='home'&&r.role)){
      residentRow(parent,r,[button('派驻此营地',()=>dispatchResident(r,c),{disabled:c.damaged})]);
    }
    if(!game.residents.some(r=>r.state==='home'&&r.role)&&!roster.length){
      const hint=document.createElement('p');hint.textContent='在城堡培养居民后，即可派驻。';parent.append(hint);
    }
  }else if(game.phase==='night'&&!c.lost){
    actions.append(button('接走驻员',()=>rescueCamp(c),{
      disabled:!staff.length||distance(game.hero,center(campTile(c)))>DEMO.rescueRange
    }));
  }
}

  if(t.node){
    const n=t.node;
    heading.textContent=NODE_NAMES[n.kind];info.textContent=NODE_TEXT[n.kind];
    if(YIELD[n.kind]){
      const c=campAt(t);
      if(c)info.textContent+=' · '+campName(c)+'：'+campStatus(c)+'。';
      if(n.developed)info.textContent+=' 已完成开发。';
      else if(day&&canDevelop(t))actions.append(button('开发资源点',()=>develop(t),{detail:'2 材料 · 1 行动',disabled}));
      else if(day&&!c&&game.castle&&isAdjacent(t))actions.append(button('占领这块地',()=>claim(t),{detail:DEMO.claimGold+' 金币'}));
      else if(!c&&!t.owned)info.textContent+=' 可从相邻领地占领，或建营地取得控制。';
    }else if(n.searched)info.textContent+=' 已调查。';
    else if(day)actions.append(button(n.kind==='danger'?'深入幽谷':n.kind==='relic'?'调查守望遗迹':'调查遗迹',()=>exploreNode(t),{
      detail:n.kind==='danger'?'4 金币 · 领主受伤 · 1 行动':n.kind==='relic'?'走近后点击，不消耗行动':'1 行动',disabled:n.kind==='relic'?false:disabled
    }));
    return;
  }
  const b=t.building;
  heading.textContent=b?(b.type==='wall'?'城墙':b.level===2?'重型塔':b.level===1?'强化箭塔':'箭塔'):'地块';
  info.textContent=b?BUILDS[b.type].info:'点空地可移动。';
  if(day&&b){
    if(b.hp<b.max)actions.append(button('维修',()=>repair(t),{detail:'3 材料',disabled:disabled||!t.owned&&!campAt(t)?.controlled}));
    const iron=game.tiles.some(cell=>cell.node?.kind==='iron'&&cell.node.developed&&canDevelop(cell));
    if(t.owned&&b.type==='tower'&&(b.level===0||b.level===1&&iron))actions.append(button(b.level===0?'升级箭塔':'改装重型塔',()=>rework(t),{detail:b.level===0?'7 材料 · 4 金币':'8 材料 · 5 金币',disabled}));
    actions.append(button('拆除并回收',()=>salvage(t),{disabled:disabled||!t.owned&&!campAt(t)?.controlled}));
  }
}
function renderUI(){
  const {phase,day}=game, night=phase==='night', active=['day','night'].includes(phase);
  $('phaseIcon').textContent=night?'☾':'☼';
  $('phaseName').textContent=phase==='won'?'守卫成功':phase==='lost'?(game.castle?'城堡失守':'领主倒下'):
    '第 '+day+(night?' 夜':game.castle?' 日 · 白天':' 日 · 探路选址');
  $('deadline').textContent=!active?'战役结束':game.scheduled?'已确认提前召唤':'第 5 夜迎战首领';
  $('actionCount').textContent=phase==='day'?'白天行动 '+game.actions+' / 7':night?'夜战进行中':'';
  const modes={camp:'选择远离正式领地的已探明陆地',claim:'选择与正式领地相邻的已探明陆地',tower:'选择可建箭塔的空地',wall:'选择可建城墙的空地'};
  $('mapHint').textContent=blocksMove()?(game.phase==='night'
    ?'面板开着：不能点地图移动。先关闭面板再走。空格或「领主攻击」仍可攻击。'
    :'关闭面板后才能移动。时钟照常运行。'):modes[game.mode]||
    (active?'试玩数值：白天 '+DEMO.daySeconds+' 秒，移速 '+DEMO.walkSpeed+' 格/秒。点「指挥」选址或建造。':'');
  $('legendControl').textContent=active?(night?(blocksMove()?'先关面板再移动 · 空格仍可攻击':'WASD / 点击移动 · 空格 / 按钮攻击'):'WASD / 点击地面移动'):'';
  $('battleHud').hidden=!night;
  renderMarch();renderCommands();updateStocks();inspect();updateBattleHud();
  const primary=$('primary');primary.replaceChildren();
  const title=$('goalTitle'), goal=$('goalText');
  if(phase==='day'&&!game.castle){
    title.textContent='探路并选择城址';
    goal.textContent='天黑自动开始。未建城时敌人追击领主，领主倒下就结束本局。';
    if(day===1)primary.append(button(game.hard?'难度：高 · 点击切换':'难度：普通 · 点击切换',
      ()=>{game.hard=!game.hard;sync();},{detail:game.hard?'居民可能永久阵亡':'居民受伤后可休养'}));
  }else if(phase==='day'){
    const raid=raidCamp();
    title.textContent=raid?'袭击预告 · '+campName(raid):game.scheduled||day===LAST_NIGHT?'准备迎战首领':'为今夜准备';
    const total=game.camps.reduce((sum,c)=>sum+campStaff(c).length,0);
    goal.textContent=raid?'主城和'+campName(raid)+'今夜同时遇袭。可以白天撤离，或留驻员守备。':
      '时钟自动入夜。采集点在天亮产出，建营地后可培养并派驻居民。';
    if(total)goal.textContent+=' 当前驻守预计维护 '+costText(maintenanceFor(total))+'。';
    if(game.cardPending)primary.append(button('选择主城强化',showCards,{gold:true}));
    if(day>=3&&day<LAST_NIGHT&&!game.scheduled)primary.append(button('预览提前召唤',summon));
  }else if(night){
    title.textContent=game.isBoss?'迎战首领':game.castle?'守住城堡':'活过这一夜';
    goal.textContent=game.castle?'箭塔和守卫自动作战。面板开着也不能点地移动，但可以攻击。可带领主去营救。':
      '敌人正在追击领主。移动后按空格或点击攻击按钮。面板不阻挡攻击。';
  }else{
    title.textContent=phase==='won'?'你守住了边境':game.castle?'城堡已失守':'领主已倒下';
    goal.textContent='本局到达第 '+day+' 夜，共击退 '+game.kills+' 名敌军。';
    primary.append(button('开始新一局',newRun,{gold:true}));
  }
  const reports=$('reports');reports.replaceChildren();
  for(const text of game.reports){const li=document.createElement('li');li.textContent=text;reports.append(li);}
}
function timeLabel(seconds){
  const remaining=Math.max(0,Math.ceil(seconds));
  return String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');
}
function updateBattleHud(){
  updateStocks();
  const clock=$('clockReadout'), night=game.phase==='night';
  clock.textContent=game.phase==='day'?'距离入夜 '+timeLabel(DEMO.daySeconds-game.phaseElapsed):night?
    (game.spawnStopped?'夜间清场':'距停止刷新 '+timeLabel(DEMO.nightSeconds-game.clock)):'';
  if(!night)return;
  const count=game.fronts.map(f=>(f.camp?campName(f.camp):game.castle?'主城':'追击')+' '+(f.queue.length+game.enemies.filter(e=>e.front===f).length)).join(' · ');
  const boss=game.enemies.find(e=>e.boss);
  $('battleText').textContent=count+(boss?' · 首领生命 '+Math.ceil(boss.hp)+'/'+boss.max:'');
  const vitals=$('vitals');
  if(vitals)vitals.textContent=(game.castle?'城堡 '+Math.ceil(game.castleHp)+'/'+game.castleMax+' 耐久 · ':'')+
    '领主 '+Math.ceil(game.hero.hp)+'/'+game.hero.max+' 生命';
}
function mapClick(t){
  if(!['day','night'].includes(game.phase))return;
  if(game.panel){toast('请先关闭地点面板。');return;}
  if(!$('commandSheet').hidden||!$('reportSheet').hidden){
    if(!(game.phase==='day'&&game.mode)){toast('请先关闭面板再移动。');return;}
  }
  if(game.phase==='day'&&game.mode){
    if(game.mode==='camp')createCamp(t);
    else if(game.mode==='claim')claim(t);
    else build(t,game.mode);
    return;
  }
  if(t.visible&&(t.node||t.building||campCore(t)||t.site!==undefined&&!game.castle)){
    openInspector(t);sync();return;
  }
  setDestination(t);
}
function newRun(){
  keys.clear();
  game=makeGame();
  scoutAroundHero();
  $('commandSheet').hidden=true;
  $('reportSheet').hidden=true;
  sync();
}

Object.keys(RESOURCE_LABELS).forEach((key,index)=>{
  const item=document.createElement('div');item.className='stock';
  const name=document.createElement('span'), dot=document.createElement('i');
  dot.style.setProperty('--t',RESOURCE_COLORS[index]);
  name.append(dot,RESOURCE_LABELS[key]);
  item.append(name,document.createElement('strong'));
  $('stocks').append(item);
});
canvas.addEventListener('click',event=>{
  const bounds=canvas.getBoundingClientRect();
  const x=Math.max(0,Math.min(WIDTH-1,Math.floor((event.clientX-bounds.left)/bounds.width*WIDTH)));
  const y=Math.max(0,Math.min(HEIGHT-1,Math.floor((event.clientY-bounds.top)/bounds.height*HEIGHT)));
  mapClick(tileAt(x,y));
});
window.addEventListener('keydown',event=>{
  const key=event.key.toLowerCase();
  if($('dialog').open)return;
  if(key==='escape'&&(game.panel||!$('commandSheet').hidden||!$('reportSheet').hidden)){event.preventDefault();hideSheets();return;}
  if(key==='escape'&&game.mode){game.mode=null;sync();return;}
  if(!['day','night'].includes(game.phase))return;
  if(key===' '&&game.phase==='night'&&!event.target.closest?.('button')){
    event.preventDefault();keys.add(key);return;
  }
  if(blocksMove())return;
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(key)){
    event.preventDefault();keys.add(key);
  }
});
window.addEventListener('keyup',event=>{keys.delete(event.key.toLowerCase());});
window.addEventListener('blur',()=>keys.clear());
$('closeInspector').addEventListener('click',closeInspector);
$('closeCommand').addEventListener('click',hideSheets);
$('closeReports').addEventListener('click',hideSheets);
$('openCommand').addEventListener('click',()=>showSheet('command'));
$('openReports').addEventListener('click',()=>showSheet('report'));
$('dialog').addEventListener('close',()=>keys.clear());
$('resetBtn').addEventListener('click',()=>{
  if(game.phase==='won'||game.phase==='lost'){newRun();return;}
  dialog('重新开局',['当前领地会重置，新一局将重新生成资源位置和地图细节。'],[{label:'开始新一局',click:newRun}]);
});
$('helpBtn').addEventListener('click',()=>dialog('操作指南',[
  '点「指挥」选址、建造和查看地点，点「战报」看记录。面板默认收起。打开后面板挡住点地和 WASD，夜里仍可用空格或「领主攻击」。',
  '正式领地沿相邻地块扩张。远处先找已探明的空地建营地，再从城堡培养居民并派驻。居民到岗会消耗金币和粮食。',
  '夜袭自动开始。夜里按空格或点「领主攻击」。地点面板开着时不能点地图移动，但攻击不受影响。遇袭营地可以白天撤人，人离开营地范围后才不再受失守影响。',
  '试玩数值：白天 '+DEMO.daySeconds+' 秒，走路 '+DEMO.walkSpeed+' 格/秒，地图 '+WIDTH+'×'+HEIGHT+'。袭击预告至少留 '+DEMO.raidReactSeconds+' 秒白天，来不及就改期。这些都还不是正式数值表。'
]));
let lastHud=0, lastDraw=0, paused=false;
function frame(now){
  if(paused){requestAnimationFrame(frame);return;}
  if(!lastFrame)lastFrame=now;
  let remaining=Math.min(.5,Math.max(0,(now-lastFrame)/1000));
  lastFrame=now;
  while(remaining>0){
    const step=Math.min(.045,remaining);
    tickCampaign(step);remaining-=step;
  }
  if(now-lastDraw>33){draw();lastDraw=now;}
  if(now-lastHud>150){updateBattleHud();lastHud=now;}
  requestAnimationFrame(frame);
}
function fitMap(){
  const frame=$('board');
  if(!frame)return;
  const availW=frame.clientWidth, availH=frame.clientHeight;
  if(!availW||!availH)return;
  const ratio=WIDTH/HEIGHT;
  let w=availW, h=w/ratio;
  if(h>availH){h=availH;w=h*ratio;}
  canvas.style.width=Math.max(1,Math.floor(w))+'px';
  canvas.style.height=Math.max(1,Math.floor(h))+'px';
}
new ResizeObserver(()=>fitMap()).observe($('board'));
fitMap();
newRun();
requestAnimationFrame(frame);
window.FW={
  get game(){return game;},
  setGame(next){game=next;},
  DEMO,WIDTH,HEIGHT,CELL,keys,
  tickCampaign,makeGame,raidCamp,evacuateCamp,loseCamp,exploreNode,
  scoutAroundHero,attack,moveHero,mapClick,setDestination,dawn,advanceBattle,
  settleCampDawn,startNight,postResident,chooseSite,createCamp,build,findPath,
  tileAt,at,center,campTile,dispatchResident,updateResidents,returnResident,
  campStaff,releaseEvacuee,noteRaidWindow,paintNode,newRun,sync,draw,
  pause(){paused=true;},
  resume(){paused=false;}
};
